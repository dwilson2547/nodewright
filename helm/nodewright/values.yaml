image:
  repository: dwilson2547/nodewright
  # A release from CHANGELOG.md. Bumping this is how a release reaches the
  # cluster; :latest is pushed too, but the chart doesn't follow it.
  tag: "0.20.0"
  pullPolicy: IfNotPresent

# Public (Traefik pubsecure, letsencrypt-prod, external-dns). Everything but
# /api/health, /api/config and the sign-in routes needs an authentik session.
ingress:
  host: nodewright.danwils.com
  tlsSecretName: nodewright-danwils-tls

# Applied by hand; template in infra/cluster-config/example-secrets/nodewright/.
databaseSecret: nodewright-db   # key DATABASE_URL (cluster Postgres)

# authentik OIDC client (cluster-config authentik/blueprints/nodewright.yaml).
# The redirect URI derives from ingress.host.
oidc:
  issuer: https://auth.danwils.com/application/o/nodewright/
  clientId: nodewright
  secretName: nodewright-oidc   # key client_secret
  # The pod has no IPv6 route and auth.danwils.com resolves to Cloudflare IPv6
  # only, so reach authentik over the LAN via traefik-public, as DanWiki does.
  hostAliases:
    - ip: 192.168.0.65
      hostnames:
        - auth.danwils.com

# Uploaded images/files (design §3.3), in AIStor. The secret is hand-applied
# with keys S3_ACCESS_KEY / S3_SECRET_KEY. Leave s3Endpoint empty to disable.
attachments:
  s3Endpoint: http://192.168.0.10:30320
  bucket: nodewright
  secretName: nodewright-bucket-credentials
  maxBytes: 20971520
  # Files nothing has used for this many days are deleted (design §3.3); 0 keeps them.
  keepDays: 30

# render_canvas MCP tool: a headless browser screenshots /render through
# the in-cluster service (design §7). Shared with the scrapers, which cap it at
# 5 concurrent sessions. Leave empty to disable the tool.
render:
  browserlessUrl: http://browserless.scrape-stack.svc:3000

# authentik group -> organisation (design §19). At each sign-in, members of a
# listed group join that org (created when first needed) with that role, and
# leave it when they leave the group. Only these orgs, and only memberships
# that came from here, are touched. Needs the groups claim (profile scope).
# Example:
#   orgGroups:
#     acme-staff: {org: Acme, role: member}
#     acme-admins: {org: Acme, role: admin}
orgGroups: {}

# One replica: the schema is created at startup (create_all), and two pods
# racing that on first boot is the one thing that could go wrong. All state is
# in Postgres, so scaling later only needs migrations to run once.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
